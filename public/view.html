<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IdeaForest – View</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="page-select">
  <div class="landing-card">
    <h1 class="landing-title">IdeaForest<img class="brand-icon brand-icon-lg" src="icon.svg" alt=""></h1>
    <p class="landing-tagline">View a participant's idea trees (read-only)</p>
    <label class="landing-label" for="sel-condition">Condition</label>
    <select id="sel-condition" class="field-input" onchange="onConditionChange()"><option value="">Loading…</option></select>
    <label class="landing-label" for="sel-pid">Participant ID</label>
    <select id="sel-pid" class="field-input" onchange="onPidChange()" disabled><option value="">Select a condition first</option></select>
    <p class="field-error" id="select-error" style="display:none"></p>
    <button class="btn btn-primary" id="btn-view" disabled onclick="submitView()">View idea trees</button>
  </div>
</div>

<div id="page-view" style="display:none" class="app5">
  <nav class="top-nav a5-nav">
    <div class="nav-logo" style="cursor:default">IdeaForest<img class="brand-icon" src="icon.svg" alt=""></div>
    <span class="nav-finalized-count" id="v-info"></span>
    <button class="btn btn-outline btn-sm nav-export" onclick="backToSelect()">Change participant</button>
  </nav>
  <div class="v-main">
    <div class="panel a5-tree">
      <div class="panel-header">Idea Trees</div>
      <div class="a5-hintrow" id="tree-subheader"></div>
      <div class="tree-area" id="tree-area">
        <div class="tree-scroll" id="tree-scroll">
          <div id="tree-canvas" class="tree-canvas"><svg id="tree-svg"></svg><div id="tree-nodes"></div></div>
        </div>
      </div>
    </div>
    <aside class="v-side" id="v-side" style="display:none">
      <div class="panel-header">Node details<button class="btn btn-outline btn-sm" onclick="closeDetails()">✕ Close</button></div>
      <div class="v-side-body" id="v-side-body"></div>
    </aside>
  </div>
</div>
<script src="prompts.js"></script>
<script src="shared.js"></script>
<script src="view.js"></script>
</body>
</html>
